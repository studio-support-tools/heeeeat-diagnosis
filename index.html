function question(){let n=state.step,q=Q[n];el.innerHTML=`<div class="question"><div class="progressrow"><span>カラダづくりタイプ診断</span><span>STEP ${n+1} / 12</span></div><div class="progress"><div style="width:${(n+1)/12*100}%"></div></div><div class="eyebrow">${n<2?'ABOUT YOU':n<4?'YOUR GOAL':n<6?'YOUR STYLE':n<8?'YOUR PACE':n<10?'YOUR BODY': 'YOUR MOTIVATION'}</div><h2>${q.t}</h2><div class="options">${q.a.map((x,i)=>`<button class="option" data-idx="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${x}</span></button>`).join('')}</div><button class="back" id="back">← ${n?'前の質問に戻る':'最初に戻る'}</button><div class="micro">直感で一番近いものを選んでね</div></div>`;el.querySelectorAll('[data-idx]').forEach(b=>b.onclick=()=>pick(Number(b.dataset.idx)));document.getElementById('back').onclick=back}
function result(){let r=state.result,rank=r.ranking.slice(0,3);el.innerHTML=`<div class="result"><div class="eyebrow" style="text-align:center">YOUR FITNESS MATCH</div><div class="result-head"><div class="result-icon">${r.type.icon}</div><div style="font-size:12px;font-weight:800;color:var(--green)">あなたのカラダづくりタイプは…</div><h2>${r.type.title}</h2><p>${r.type.desc}</p></div><h3 class="heading">📊 あなたの回答傾向</h3><div class="card">${r.axes.map(x=>`<div class="bar-row"><span>${x.name}</span><div class="bar"><div style="width:${x.value}%"></div></div><b>${x.value}</b></div>`).join('')}<p class="note">※自己申告の目的・好みから算出した相対指標です。身体能力の検査結果ではありません。</p></div><h3 class="heading">🏅 おすすめの運動 TOP3</h3><p class="note">あなたの目的・運動の好み・経験に基づく提案です。</p>${rank.map((x,i)=>`<div class="card ${i===0?'soft':''}"><div><span class="rank">${i+1}</span><span class="rank-title">${PROGRAMS[x.id].name}</span></div><p style="font-size:13px;margin:9px 0 4px">${PROGRAMS[x.id].desc}</p><p class="note">${i===0?'最初に試したい候補':'目的に合わせて取り入れたい候補'}｜${PROGRAMS[x.id].level===0?'強度は内容により調整':'目安強度 '+ '🔥'.repeat(PROGRAMS[x.id].level)}</p></div>`).join('')}<h3 class="heading">🌱 あなたへのワンポイント</h3><div class="card soft">${r.type.advice}<br><br><b>まず試すなら：</b>${PROGRAMS[rank[0].id].tip}</div><div class="booking"><div class="eyebrow">NEXT STEP</div><h3>あなたに合う運動を、<br>無料体験で見つけよう。</h3><p>Heeeeat!では少人数でのトレーナー指導を通して、目的に合う運動の始め方を相談できます。</p><a class="cta booking-link" id="book" href="${CONFIG.bookingUrl}" rel="noopener">${CONFIG.bookingLabel} →</a>${CONFIG.bookingUrl?'':'<div class="disablednote">試作版：予約URLは未設定です。CONFIG.bookingUrl に実際の予約URLを設定すると、このボタンが有効になります。</div>'}<p class="note">※診断上位のプログラムを必ず体験できることを保証するものではありません。開催内容をご確認ください。</p></div><div class="actions"><button class="smallbtn" id="copy">結果をコピー</button><button class="smallbtn" id="retry">もう一度診断</button></div><div class="micro">この結果は自己申告に基づく参考情報です。</div></div>`;document.getElementById('book').addEventListener('click',()=>{track('booking_click',{result_type:r.type.title,top_program:rank[0].id})});document.getElementById('retry').onclick=()=>{state={step:-1,answers:Array(12).fill(null),result:null};render()};document.getElementById('copy').onclick=async()=>{let str=`私のカラダづくりタイプは「${r.type.title}」！\nおすすめ運動TOP3：\n${rank.map((x,i)=>`${i+1}. ${PROGRAMS[x.id].name}`).join('\n')}\nHeeeeat!のカラダづくりタイプ診断`;try{await navigator.clipboard.writeText(str);document.getElementById('copy').textContent='コピーしました ✓'}catch(e){prompt('こちらをコピーしてください',str)}}}
function render(){window.scrollTo({top:0,behavior:'instant'});if(state.step<0)home();else if(state.step<12)question();else result()}document.documentElement.style.setProperty('--green',CONFIG.primary);render();
</script></body></html>
